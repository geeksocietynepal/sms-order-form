/* Prevent horizontal scrolling */
html, body {
    height: 100%; 
    margin: 0;    
    overflow-x: hidden; 
    overflow-y: auto;  
}

/* Set the background image area */
div[style*="background-image"] {
    background-size: cover;
    width: 100%;
    height: 55vh;
    overflow: hidden;
}

@media (max-width: 1024px) {
    div[style*="background-image"] {
        height: 35vh;
    }
}

@media (max-width: 768px) {
    div[style*="background-image"] {
        height: 25.3vh;
    }
}

@media (max-width: 480px) {
    div[style*="background-image"] {
        height: 18vh;
    }
}

/* Ensure the card doesn't overflow */
.card {
    width: 100%;
    display: flex;
    flex-direction: column;
    min-height: 100vh; /* Ensures it takes full screen height */
}

/* Prevent overflowing form content */
form {
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
    overflow-x: hidden; 
    overflow-y: auto; 
}

/* Make form elements responsive */
input, select, textarea {
    width: 100%;
    box-sizing: border-box; 
}

img, video {
    max-width: 100%;
    height: auto;
    display: block;
}

button {
    width: 100%;
}

.card-body {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; 
}
     
.form-check-input {
    display: none;
}

.btn-custom {
    display: inline-block;
    padding: 12px 24px;
    background-color: #461ca0;
    color: white;
    border: 1px solid #2a1061;
    border-radius: 25px;
    text-align: center;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    transition: all 0.3s ease;
    margin-right: 12px;
    margin-bottom: 12px;
    min-width: 120px;
}

.form-check-input:checked + .btn-custom {
    background-color: #28a745;
    border-color: #28a745;
}

.btn-custom:hover {
    background-color: #56369b;
    border-color: #56369b;
}

.form-check-input:focus + .btn-custom {
    outline: none;
    box-shadow: 0 0 0 0.2rem rgba(2, 33, 66, 0.25);
}

.form-control, .form-select {
    border-radius: 25px;
    padding: 12px 20px;
    border: 1px solid #ced4da;
    transition: all 0.3s ease;
    font-size: 0.95rem;
    color: #495057;
}

.form-control:focus, .form-select:focus {
    border-color: #461ca0;
    box-shadow: 0 0 0 0.2rem rgba(70, 28, 160, 0.15);
}

.address-section {

    <div class="">
        <div class="">
            <div class="card badge-gray-100">
                <div class="row">
                    <div style="background-image: url('admin/images/guruji_cover.jpg'); background-size: cover; ">
                        <div class="card-body p-20" style="height: 100%; display: flex; justify-content: center; align-items: center;">
                            <div id="carouselExampleCaptions" class="lide text-center widget-carousel" data-bs-ride="carousel">
                                <div class="carousel-inner">
                                    <div class="carousel-item active">
                                        <div class="text-center p-1">
                                            <i class="mdi mdi-bitcoin widget-box-1-icon"></i>
                                            <div class="avatar-md m-auto">
                                                <span class="avatar-title rounded-circle bg-light-subtle text-white font-size-24">
                                                    <i class="mdi mdi-currency-btc"></i>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row justify-content-center ">
                    <div class="col-lg-10 col-md-10 col-sm-12">
                        <div class="p-4 p-md-5">
                            <form method="POST" data-parsley-validate id="myForm">
                                <div class="row">
                                    <!-- Order Type -->
                                    <div class="col-md-12  mb-3">
                                        <label class="form-label" for="orderType">Order Type</label>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="orderType" id="orderTypeNone" value="" checked >
                                            <input class="form-check-input" type="radio" name="orderType" id="national" value="national" required>
                                            <label class="btn-custom" for="national">National (Nepal)</label>
                                            <input class="form-check-input" type="radio" name="orderType" id="international" value="international" required>
                                            <label class="btn-custom" for="international">International</label>
                                        </div>
                                    </div>

                                    <!-- Sewa Type -->
                                    <div class="col-md-6 col-sm-12 mb-3">
                                        <label class="form-label" for="sewaType">Sewa Type</label>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="sewaType" id="normal" value="normal" required>
                                            <label class="btn-custom" for="normal">Normal</label>

                                            <input class="form-check-input" type="radio" name="sewaType" id="urgent" value="urgent" required>
                                            <label class="btn-custom" for="urgent">Urgent</label>
                                        </div>
                                    </div>

                  
                                    <!-- Payment Type -->
                                    <div class="col-md-6 col-sm-12 mb-3">
                                        <label class="form-label" for="paymentType">Payment Type</label>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="paymentType" id="free" value="free" required>
                                            <label class="btn-custom" for="free">Free</label>

                                            <input class="form-check-input" type="radio" name="paymentType" id="paid" value="paid" required>
                                            <label class="btn-custom" for="paid">Paid</label>
                                        </div>
                                    </div>

                                    <!-- Phone Number -->
                                    <div class="col-md-12 col-sm-12 mb-3">
                                    <label class="form-label" for="phone">Phone Number</label>
                    
                                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter phone number" required 
                                            data-parsley-type="number" 
                                            data-parsley-minlength="10" 
                                            data-parsley-maxlength="10">
                                    
                                    <!-- <small class="text-muted">Format: Country Code + Phone Number</small> -->
                                    </div>
                

                                    <!-- Buyer Name -->
                                    <div class="col-md-6 col-sm-12 mb-3">
                                    <label class="form-label" for="buyerFullName">Buyer Full Name</label>
                                
                                        <input type="text" class="form-control" id="buyerFullName" name="buyerFullName" placeholder="Enter Buyer Full Name" required 
                                            data-parsley-type="string" 
                                            data-parsley-minlength="20" 
                                            data-parsley-maxlength="20">
                               
                                    <!-- <small class="text-muted">Format: Country Code + Phone Number</small> -->
                                    </div>

                                    <!-- Book Selection -->
                                    <div class="col-md-6 col-sm-12 mb-3">
                                        <label class="form-label" for="bookSelect">Select Book</label>
                                        <select class="form-select" id="bookSelect" name="bookSelect" required>
                                            <option value="">Search and Select a book</option>
                                        </select>
                                    </div>

                                    <!-- Address Section -->
                                    <div class="col-12 mb-3">
                                        <div class="address-section">
                                            <h5>Address Details</h5>
                                            <div class="row">
                                                <div class="col-md-6 col-sm-12 mb-3">
                                                    <label class="form-label" for="country">Country</label>
                                                    <select class="form-select" id="country" name="country" required>
                                                        <option value="">Select Country</option>
                                                        <option value="Nepal">Nepal</option>
                                                        <option value="India">India</option>
                                                        <option value="other">Other</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-6 col-sm-12 mb-3">
                                                    <label class="form-label" for="province">Province / State</label>
                                                    <select class="form-select" id="province" name="province" required>
                                                        <option value="">Select Province</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-6 col-sm-12 mb-3">
                                                    <label class="form-label" for="district">District</label>
                                                    <select class="form-select" id="district" name="district" required>
                                                        <option value="">Select District</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-6 col-sm-12 mb-3">
                                                    <label class="form-label" for="municipality">Municipality</label>
                                                    <select class="form-select" id="municipality" name="municipality" required>
                                                        <option value="">Select Municipality</option>
                                                    </select>
                                                </div>
                                                <div class="col-12 mb-3">
                                                    <label class="form-label" for="address">City / Village / Street Address</label>
                                                    <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
                                                </div>
                                                <div class="col-12 mb-3">
                                                    <label class="form-label" for="landmark">Landmark (Optional)</label>
                                                    <input type="text" class="form-control" id="landmark" name="landmark">
                                                </div>
                                                <div class="col-12 mb-3">
                                                    <label class="form-label" for="postalCode">Postal Code (Optional)</label>
                                                    <input type="text" class="form-control" id="postalCode" name="postalCode" required pattern="[A-Za-z0-9\- ]{4,10}" data-parsley-pattern="^[A-Za-z0-9\- ]{4,10}$" data-parsley-pattern-message="Enter a valid postal code (4-10 letters/numbers).">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" id="submitBtn" class="mt-2 p-12 btn btn-primary w-100">
                                    <span id="btnText">Submit</span>
                                    <span id="btnLoader" class="spinner-border spinner-border-sm" style="display: none;"></span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="admin/js/jquery.js"></script>
    <script src="admin/js/pages/parsley.min.js"></script>
    <script src="admin/vendors/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="admin/vendors/select2/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            // Initialize Select2 for all select elements
            $('select').each(function() {
                var firstOption = $(this).find('option:first');
                var hasEmpty = firstOption.val() === '';
                $(this).select2({
                    placeholder: hasEmpty ? firstOption.text() : undefined,
                    allowClear: false,
                    width: '100%'
                });
            });

            // Load address data
            let provincesData = {};
            let districtsData = {};
            let municipalitiesData = {};

            // Fetch address data
            $.getJSON('data/address/Nepal/country_provinces.json', function(data) {
                provincesData = data;
            });

            $.getJSON('data/address/Nepal/province_districts.json', function(data) {
                districtsData = data;
            });

            $.getJSON('data/address/Nepal/district_municipalities.json', function(data) {
                municipalitiesData = data;
            });

            // Country change handler
            $('#country').change(function() {
                const country = $(this).val();
                const provinceSelect = $('#province');
                const districtSelect = $('#district');
                const municipalitySelect = $('#municipality');

                // Clear dependent fields
                provinceSelect.empty().append('<option value="">Select Province</option>');
                districtSelect.empty().append('<option value="">Select District</option>');
                municipalitySelect.empty().append('<option value="">Select Municipality</option>');

                if (country && provincesData[country]) {
                    // Populate provinces
                    provincesData[country].forEach(function(province) {
                        provinceSelect.append(`<option value="${province}">${province}</option>`);
                    });
                }
            });

            // Province change handler
            $('#province').change(function() {
                const province = $(this).val();
                const districtSelect = $('#district');
                const municipalitySelect = $('#municipality');

                // Clear dependent fields
                districtSelect.empty().append('<option value="">Select District</option>');
                municipalitySelect.empty().append('<option value="">Select Municipality</option>');

                if (province && districtsData[province]) {
                    // Populate districts
                    districtsData[province].forEach(function(district) {
                        districtSelect.append(`<option value="${district}">${district}</option>`);
                    });
                }
            });

            // District change handler
            $('#district').change(function() {
                const district = $(this).val();
                const municipalitySelect = $('#municipality');

                // Clear municipality field
                municipalitySelect.empty().append('<option value="">Select Municipality</option>');

                if (district && municipalitiesData[district]) {
                    // Populate municipalities
                    municipalitiesData[district].forEach(function(municipality) {
                        municipalitySelect.append(`<option value="${municipality}">${municipality}</option>`);
                    });
                }
            });

            // Initialize Select2 for book selection with data from books.json
            $.getJSON('data/books.json', function(data) {
                var books = data.filter(function(book) {
                    return book.status === 'Active';
                });
                var bookOptions = books.map(function(book) {
                    return {
                        id: book.name,
                        text: book.name,
                        thumbnail: book.thumbnail
                    };
                });
                $('#bookSelect').select2({
                    data: [{id: '', text: 'Search and select a book'}].concat(bookOptions),
                    placeholder: 'Search and select a book',
                    allowClear: false,
                    width: '100%',
                    templateResult: formatBookWithThumb,
                    templateSelection: formatBookWithThumb
                });
            });

            function formatBookWithThumb(state) {
                if (!state.id) return state.text;
                var thumb = state.thumbnail || $(state.element).data('thumbnail');
                if (thumb) {
                    return $(
                        `<span style="display:flex;align-items:center;"><img src="${thumb}" width="32" height="32" style="object-fit:cover;border-radius:4px;margin-right:10px;">${state.text}</span>`
                    );
                }
                return state.text;
            }

            $.getJSON('data/address/Nepal/phone_no.json', function(data) {
                const $select = $('#countryCode');

                data.forEach(function(country) {
                    const flagUrl = `https://flagcdn.com/w40/${country.value.toLowerCase()}.png`;
                    const option = new Option(country.dialCode, country.dialCode, false, false);
                    $(option).attr('data-flag', flagUrl);
                    $select.append(option);
                });

                $select.select2({
                    templateResult: formatOptionWithFlag,
                    templateSelection: formatSelectionFlagOnly,
                    allowHtml: true
                });
            });

            function formatOptionWithFlag(state) {
                if (!state.id) return state.text;
                const flag = $(state.element).data('flag');
                const text = state.text;
                const match = text.match(/^([+\\d]+)\s*\((.*)\)$/);
                if (match) {
                    return $(
                        `<span>
                            <img src="${flag}" width="22" style="margin-right: 8px;vertical-align:middle;">
                            <span class="country-code-small">${match[1]}</span>
                            <span style="margin-left:6px;">(${match[2]})</span>
                        </span>`
                    );
                }
                return $(`<span><img src="${flag}" width="22" style="margin-right: 8px;vertical-align:middle;"> ${text}</span>`);
            }

            function formatSelectionFlagOnly(state) {
                if (!state.id) return state.text;
                const flag = $(state.element).data('flag');
                return $(`<span><img src="${flag}" width="22" style="vertical-align:middle;"></span>`);
            }

            // Format phone number as user types, limit to 10 digits
            $('#phone').on('input', function() {
                let value = $(this).val().replace(/\D/g, '').slice(0, 10);
                $(this).val(value);
            });

            $('#myForm').submit(function (e) {
                e.preventDefault();  // Prevent default form submission
                
                var submitBtn = $('#submitBtn');
                var btnText = $('#btnText');
                var btnLoader = $('#btnLoader');
                
                const url = "https://script.google.com/macros/s/AKfycbzKWgZF2C34hO2ml6ol9rDoSSyMrKizEFSVHJF3uhXQ5BCogA65kwSHTPu04KY1GMYYnQ/exec ";
                
                var formData = new FormData(this);

                const socialMediaGroups = Array.from(document.querySelectorAll('input[name="socialMediaGroup"]:checked'))
                    .map(checkbox => checkbox.value)
                    .join(", ");  

                // Get the selected values for 'AdditionalSewa' and join them with commas
                const additionalSewaDistrictState = Array.from(document.querySelectorAll('input[name="AdditionalSewa"]:checked'))
                    .map(checkbox => checkbox.value)
                    .join(", ");  

                    const data = {
                        nameInput: formData.get('nameInput'),
                        phone_number: formData.get('phone_number'),
                        mantraType: formData.get('mantraType'),
                        mantraTakenDate: formData.get('mantraTakenDate'),
                        dob: formData.get('dob'),
                        gender: formData.get('gender'),
                        member_bhagat: formData.get('member_bhagat'),
                        yesanotherBhagat: formData.get('member_bhagat') === "Yes" ? formData.get('yesanotherBhagat') : null,
                        permanentAddressStateInput: formData.get('permanentAddressStateInput'),
                        permanentAddressDistrictInput: formData.get('permanentAddressDistrictInput'),
                        permanentAddressMunicipalityInput: formData.get('permanentAddressMunicipalityInput'),
                        permanentAddressWardInput: formData.get('permanentAddressWardInput'),
                        permanentAddressToleInput: formData.get('permanentAddressToleInput'),
                        temporaryAddressStateInput: formData.get('temporaryAddressStateInput'),
                        temporaryAddressDistrictInput: formData.get('temporaryAddressDistrictInput'),
                        temporaryAddressMunicipalityInput: formData.get('temporaryAddressMunicipalityInput'),
                        temporaryAddressWardInput: formData.get('temporaryAddressWardInput'),
                        temporaryAddressToleInput: formData.get('temporaryAddressToleInput'),
                        bloodgroup: formData.get('bloodgroup'),
                        blood_donation: formData.get('blood_donation'),
                        socialMediaGroups: socialMediaGroups,
                        social_media_sewa_status: formData.get('social_status'),
                        additionalSewaDistrictState: additionalSewaDistrictState,
                        sms_status: formData.get('sms_status'),
                        smsSewaGroupInput: formData.get('smsSewaGroupInput'),
                        specialSewaSMSInput: formData.get('specialSewaSMSInput'),
                        calling_sewa: formData.get('calling_sewa'),
                        feedback_calling_sewa: formData.get('feedback_calling_sewa'),
                        otherSewaResponsibilityInput: formData.get('otherSewaResponsibilityInput')
                    };


                console.log(data);

                // Show loading spinner in button and disable it
                btnLoader.show();
                btnText.hide();
                submitBtn.prop('disabled', true);

                // Use SweetAlert2 to show a loading state
                Swal.fire({
                    title: 'Processing...',
                    text: 'Please wait while we process your request.',
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                // Send AJAX request
                $.ajax({
                    url: url,
                    type: "POST",
                    data: JSON.stringify(data),
                    success: function (response) {
                        console.log("Success:", response);

                        // Show success message
                        Swal.fire({
                            title: 'Success!',
                            text: `${response.message}`,
                            icon: 'success'
                        }).then(() => {
                            btnLoader.hide();
                            btnText.show();
                            submitBtn.prop('disabled', false);  // Re-enable the button
                        });
                    },
                    error: function (xhr, status, error) {
                        console.error("Error:", error);

                        // Show error message
                        Swal.fire({
                            title: 'Error!',
                            text: 'An error occurred while sending the request.',
                            icon: 'error'
                        }).then(() => {
                            btnLoader.hide();
                            btnText.show();
                            submitBtn.prop('disabled', false);  // Re-enable the button
                        });
                    }
                });
            });

            // Set default checked for Sewa Type: Normal and Payment Type: Free
            // $('#normal').prop('checked', true);
            $('#free').prop('checked', true);

            // National/International logic
            $('input[name="orderType"]').change(function() {
                if ($('#national').is(':checked')) {
                    // Set country to Nepal and trigger change
                    $('#country').val('Nepal').trigger('change');
                    // Wait for provincesData to be loaded, then populate provinces
                    setTimeout(function() {
                        const provinceSelect = $('#province');
                        provinceSelect.empty().append('<option value="">Select Province</option>');
                        if (provincesData['Nepal']) {
                            provincesData['Nepal'].forEach(function(province) {
                                provinceSelect.append(`<option value="${province}">${province}</option>`);
                            });
                        }
                    }, 100);
                } else {
                    // Clear country and province
                    $('#country').val('').trigger('change');
                    $('#province').empty().append('<option value="">Select Province</option>');
                }
            });

            // If National is default, trigger change on load
            if ($('#national').is(':checked')) {
                $('#national').trigger('change');
            }

            $('#myForm').submit(function (e) {
                e.preventDefault();
                var submitBtn = $('#submitBtn');
                var btnText = $('#btnText');
                var btnLoader = $('#btnLoader');

                const url = "https://script.google.com/macros/s/AKfycbzKWgZF2C34hO2ml6ol9rDoSSyMrKizEFSVHJF3uhXQ5BCogA65kwSHTPu04KY1GMYYnQ/exec";
                var formData = new FormData(this);
                var data = {};
                formData.forEach(function(value, key){
                    data[key] = value;
                });

                // Log the request data
                console.log('Request data:', data);

                // Show loading spinner in button and disable it
                btnLoader.show();
                btnText.hide();
                submitBtn.prop('disabled', true);

                // Send AJAX request
                $.ajax({
                    url: url,
                    type: "POST",
                    data: JSON.stringify(data),
                    success: function (response) {
                        console.log("Success:", response);

                        // Show success message
                        Swal.fire({
                            title: 'Success!',
                            text: `${response.message}`,
                            icon: 'success'
                        }).then(() => {
                            btnLoader.hide();
                            btnText.show();
                            submitBtn.prop('disabled', false);  // Re-enable the button
                        });
                    },
                    error: function (xhr, status, error) {
                        console.error("Error:", error);

                        // Show error message
                        Swal.fire({
                            title: 'Error!',
                            text: 'An error occurred while sending the request.',
                            icon: 'error'
                        }).then(() => {
                            btnLoader.hide();
                            btnText.show();
                            submitBtn.prop('disabled', false);  // Re-enable the button
                        });
                    }
                });
            });
        });
    </script>
</body>

</html>
